<!DOCTYPE html>
<html>

<head>

    <title>AI Phishing Detector</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 550px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-top: 10px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            background-color: #334155;
            padding: 20px;
            border-radius: 8px;
            min-height: 120px;
        }

        .loading {
            color: #93c5fd;
            font-style: italic;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Phishing Detector</h1>

        <textarea 
            id="emailText"
            placeholder="Paste suspicious email here..."
        ></textarea>

        <button onclick="analyzeEmail()">
            Analyze Email
        </button>

        <div class="result" id="result">
            Results will appear here...
        </div>

    </div>

    <script>

        async function analyzeEmail() {

            const emailText = document.getElementById("emailText").value;

            if (!emailText.trim()) {

                document.getElementById("result").innerHTML = `
                    <p>Please paste an email first.</p>
                `;

                return;
            }

            document.getElementById("result").innerHTML = `
                <p class="loading">Analyzing email...</p>
            `;

            try {

                const response = await fetch("/analyze", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email_text: emailText
                    })

                });

                const data = await response.json();

                let riskColor = "green";

                if (data.analysis.risk_level === "High") {
                    riskColor = "red";
                }
                else if (data.analysis.risk_level === "Medium") {
                    riskColor = "orange";
                }

                document.getElementById("result").innerHTML = `

                    <h2 style="color:${riskColor}">
                        Risk Level: ${data.analysis.risk_level}
                    </h2>

                    <p>
                        <strong>Explanation:</strong><br><br>
                        ${data.analysis.explanation}
                    </p>

                    <p>
                        <strong>Recommended Action:</strong><br><br>
                        ${data.analysis.recommended_action}
                    </p>

                `;

            }

            catch (error) {

                document.getElementById("result").innerHTML = `
                    <p style="color:red;">
                        Error connecting to server.
                    </p>
                `;

                console.error(error);
            }

        }

    </script>

</body>

</html>
